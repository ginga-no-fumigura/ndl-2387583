name: 大意の誤り
description: 大意の誤りや、よりよい大意を知らせる
title: "[訳] 蕪村句集講義 春之部 夏之部 秋之部 冬之部 "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "行頭にある ID（例: ndl-2387583-0001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの大意
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した大意
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
